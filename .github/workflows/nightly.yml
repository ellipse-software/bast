name: nightly

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.value }}
    defaults:
      run:
        working-directory: apps/bast
    steps:
      - uses: actions/checkout@v7
      - name: Require master
        run: test "$GITHUB_REF" = "refs/heads/master"
      - name: Resolve nightly version
        id: version
        run: echo "value=nightly.$(date -u +%Y%m%d).${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/bast/go.mod
          cache: true
          cache-dependency-path: apps/bast/go.sum
      - run: go mod verify
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go test -race ./...
      - run: go vet ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: validate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/bast
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/bast/go.mod
          cache: true
          cache-dependency-path: apps/bast/go.sum
      - name: Build archive
        id: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          version="$VERSION"
          bundle="bast_${version}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$bundle"

          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=$version" \
            -o "dist/$bundle/bast" \
            .

          cp ../../LICENSE README.md "dist/$bundle/"
          tar -C dist -czf "dist/$bundle.tar.gz" "$bundle"
          (cd dist && shasum -a 256 "$bundle.tar.gz" > "$bundle.tar.gz.sha256")

          echo "artifact=$bundle" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: |
            apps/bast/dist/*.tar.gz
            apps/bast/dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build windows/${{ matrix.goarch }}
    needs: validate
    runs-on: blacksmith-4vcpu-windows-2025
    environment: artifact-signing
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: apps/bast
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/bast/go.mod
          cache: false
      - name: Run Windows tests
        if: matrix.goarch == 'amd64'
        run: go test ./...
      - name: Build executable
        id: build
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = "bast_${env:VERSION}_windows_${env:GOARCH}"
          New-Item -ItemType Directory -Force "dist/$bundle" | Out-Null
          go build -trimpath -ldflags "-s -w -X main.version=$env:VERSION" -o "dist/$bundle/bast.exe" .
          "artifact=$bundle" >> $env:GITHUB_OUTPUT
          "bundle=$bundle" >> $env:GITHUB_OUTPUT
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign executable
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\apps\bast\dist\${{ steps.build.outputs.bundle }}\bast.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify and package executable
        shell: pwsh
        env:
          BUNDLE: ${{ steps.build.outputs.bundle }}
        run: |
          $ErrorActionPreference = "Stop"
          $signature = Get-AuthenticodeSignature "dist/$env:BUNDLE/bast.exe"
          if ($signature.Status -ne "Valid") { throw "Invalid Authenticode signature: $($signature.Status)" }
          Copy-Item ../../LICENSE, README.md "dist/$env:BUNDLE/"
          Compress-Archive -Path "dist/$env:BUNDLE" -DestinationPath "dist/$env:BUNDLE.zip"
          $hash = (Get-FileHash "dist/$env:BUNDLE.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:BUNDLE.zip" | Set-Content -NoNewline -Encoding ascii "dist/$env:BUNDLE.zip.sha256"
      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: |
            apps/bast/dist/*.zip
            apps/bast/dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish nightly release
    needs: [build, build-windows]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          pattern: bast_nightly.*
          path: dist
          merge-multiple: true
      - name: Resolve nightly version
        id: meta
        run: |
          set -euo pipefail
          version="$(basename "$(find dist -name 'bast_nightly.*.tar.gz' | head -n1)" .tar.gz)"
          version="${version#bast_}"
          version="${version%_*_*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create combined checksums
        run: (cd dist && shasum -a 256 bast_nightly.*.tar.gz bast_nightly.*.zip > SHA256SUMS)
      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          assets=(dist/bast_nightly.*.tar.gz dist/bast_nightly.*.tar.gz.sha256 dist/bast_nightly.*.zip dist/bast_nightly.*.zip.sha256 dist/SHA256SUMS)
          title="Bast nightly (${VERSION})"

          notes="Nightly build from \`master\`. Version: \`${VERSION}\`."
          state="$(gh release view "$VERSION" --json isDraft --jq '.isDraft' 2>/dev/null || true)"

          if [[ "$state" == "true" ]]; then
            gh release upload "$VERSION" "${assets[@]}" --clobber
            gh release edit "$VERSION" --draft=false --prerelease --title "$title" --notes "$notes"
          elif [[ "$state" == "false" ]]; then
            echo "Nightly release ${VERSION} is already published."
          else
            gh release create "$VERSION" \
              --draft \
              --prerelease \
              --latest=false \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes"
            gh release upload "$VERSION" "${assets[@]}"
            gh release edit "$VERSION" --draft=false --prerelease --latest=false --title "$title" --notes "$notes"
          fi

  bump-homebrew:
    name: Bump Homebrew nightly formula
    needs: release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Update homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          NIGHTLY_VERSION: ${{ needs.release.outputs.version }}
        run: bash .github/scripts/bump-homebrew-tap-nightly.sh "$NIGHTLY_VERSION"
