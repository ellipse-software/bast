name: nightly

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - run: go mod verify
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go test -race ./...
      - run: go vet ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Build archive
        id: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail

          version="nightly.$(date -u +%Y%m%d).${GITHUB_SHA:0:7}"
          bundle="bast_${version}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$bundle"

          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=$version" \
            -o "dist/$bundle/bast" \
            .

          cp LICENSE README.md "dist/$bundle/"
          tar -C dist -czf "dist/$bundle.tar.gz" "$bundle"
          (cd dist && shasum -a 256 "$bundle.tar.gz" > "$bundle.tar.gz.sha256")

          echo "artifact=$bundle" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish nightly release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          pattern: bast_nightly_*
          path: dist
          merge-multiple: true
      - name: Resolve nightly version
        id: meta
        run: |
          set -euo pipefail
          version="$(basename "$(find dist -name 'bast_nightly.*.tar.gz' | head -n1)" .tar.gz)"
          version="${version#bast_}"
          version="${version%_*_*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create combined checksums
        run: (cd dist && shasum -a 256 bast_nightly_*.tar.gz > SHA256SUMS)
      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          assets=(dist/bast_nightly_*.tar.gz dist/bast_nightly_*.tar.gz.sha256 dist/SHA256SUMS)
          title="Bast nightly (${VERSION})"

          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly "${assets[@]}" --clobber
            gh release edit nightly --prerelease --title "$title" --notes "Rolling nightly build from \`master\`. Version: \`${VERSION}\`."
          else
            gh release create nightly "${assets[@]}" \
              --prerelease \
              --target master \
              --title "$title" \
              --notes "Rolling nightly build from \`master\`. Version: \`${VERSION}\`."
          fi

  bump-homebrew:
    name: Bump Homebrew nightly formula
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Update homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          NIGHTLY_VERSION: ${{ needs.release.outputs.version }}
        run: bash .github/scripts/bump-homebrew-tap-nightly.sh "$NIGHTLY_VERSION"
