name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/bast
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/bast/go.mod
          cache: true
          cache-dependency-path: apps/bast/go.sum
      - run: go mod verify
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go test -race ./...
      - run: go vet ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/bast
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/bast/go.mod
          cache: true
          cache-dependency-path: apps/bast/go.sum
      - name: Build archive
        id: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="dev-${GITHUB_SHA:0:7}"
          fi

          bundle="bast_${version#v}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$bundle"

          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=$version" \
            -o "dist/$bundle/bast" \
            .

          cp ../../LICENSE README.md "dist/$bundle/"
          tar -C dist -czf "dist/$bundle.tar.gz" "$bundle"
          (cd dist && shasum -a 256 "$bundle.tar.gz" > "$bundle.tar.gz.sha256")

          echo "artifact=$bundle" >> "$GITHUB_OUTPUT"
      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: |
            apps/bast/dist/*.tar.gz
            apps/bast/dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          pattern: bast_*
          path: dist
          merge-multiple: true
      - name: Create combined checksums
        run: (cd dist && shasum -a 256 *.tar.gz > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          assets=(dist/*.tar.gz dist/*.tar.gz.sha256 dist/SHA256SUMS)
          title="Bast $GITHUB_REF_NAME"
          state="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null || true)"

          if [[ "$state" == "true" ]]; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest --title "$title"
          elif [[ "$state" == "false" ]]; then
            echo "Release ${GITHUB_REF_NAME} is already published."
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "$title"
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}"
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest --title "$title"
          fi

  bump-homebrew:
    name: Bump Homebrew formula
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Update homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: bash .github/scripts/bump-homebrew-tap.sh "$GITHUB_REF_NAME"
