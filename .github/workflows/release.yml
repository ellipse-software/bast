name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/bast
    steps:
      - uses: actions/checkout@v7
      - name: Require changelog notes
        working-directory: .
        run: bash .github/scripts/changelog.sh extract "$GITHUB_REF_NAME" >/dev/null
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/bast/go.mod
          cache: true
          cache-dependency-path: apps/bast/go.sum
      - run: go mod verify
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go test -race ./...
      - run: go vet ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: validate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/bast
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/bast/go.mod
          cache: true
          cache-dependency-path: apps/bast/go.sum
      - name: Build archive
        id: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail

          version="$GITHUB_REF_NAME"

          bundle="bast_${version#v}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$bundle"

          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=$version" \
            -o "dist/$bundle/bast" \
            .

          cp ../../LICENSE README.md "dist/$bundle/"
          tar -C dist -czf "dist/$bundle.tar.gz" "$bundle"
          (cd dist && shasum -a 256 "$bundle.tar.gz" > "$bundle.tar.gz.sha256")

          echo "artifact=$bundle" >> "$GITHUB_OUTPUT"
      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: |
            apps/bast/dist/*.tar.gz
            apps/bast/dist/*.sha256
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Build windows/${{ matrix.goarch }}
    needs: validate
    runs-on: blacksmith-4vcpu-windows-2025
    environment: artifact-signing
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: apps/bast
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/bast/go.mod
          cache: false
      - name: Run Windows tests
        if: matrix.goarch == 'amd64'
        run: go test ./...
      - name: Build executable
        id: build
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:GITHUB_REF_NAME
          $bundle = "bast_$($version.TrimStart('v'))_windows_$env:GOARCH"
          New-Item -ItemType Directory -Force "dist/$bundle" | Out-Null
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o "dist/$bundle/bast.exe" .
          "artifact=$bundle" >> $env:GITHUB_OUTPUT
          "bundle=$bundle" >> $env:GITHUB_OUTPUT
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign executable
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\apps\bast\dist\${{ steps.build.outputs.bundle }}\bast.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify and package executable
        shell: pwsh
        env:
          BUNDLE: ${{ steps.build.outputs.bundle }}
        run: |
          $ErrorActionPreference = "Stop"
          $signature = Get-AuthenticodeSignature "dist/$env:BUNDLE/bast.exe"
          if ($signature.Status -ne "Valid") { throw "Invalid Authenticode signature: $($signature.Status)" }
          Copy-Item ../../LICENSE, README.md "dist/$env:BUNDLE/"
          Compress-Archive -Path "dist/$env:BUNDLE" -DestinationPath "dist/$env:BUNDLE.zip"
          $hash = (Get-FileHash "dist/$env:BUNDLE.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:BUNDLE.zip" | Set-Content -NoNewline -Encoding ascii "dist/$env:BUNDLE.zip.sha256"
      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: |
            apps/bast/dist/*.zip
            apps/bast/dist/*.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-windows]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          pattern: bast_*
          path: dist
          merge-multiple: true
      - name: Build Linux packages
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            bash .github/scripts/package-linux.sh "$GITHUB_REF_NAME" dist
          else
            echo "Skipping Linux packages for prerelease tag $GITHUB_REF_NAME"
          fi
      - name: Create combined checksums
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          files=(*.tar.gz *.zip *.deb *.rpm *.apk *.pkg.tar.zst)
          shasum -a 256 "${files[@]}" > SHA256SUMS
      - name: Render WinGet manifest
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            bash .github/scripts/render-winget-manifest.sh "$GITHUB_REF_NAME" dist
          else
            echo "Skipping WinGet manifests for prerelease tag $GITHUB_REF_NAME"
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          winget_manifests=(dist/EllipseSoftware.Bast*.yaml)
          assets=(
            dist/*.tar.gz dist/*.tar.gz.sha256
            dist/*.zip dist/*.zip.sha256
            dist/*.deb dist/*.deb.sha256
            dist/*.rpm dist/*.rpm.sha256
            dist/*.apk dist/*.apk.sha256
            dist/*.pkg.tar.zst dist/*.pkg.tar.zst.sha256
            dist/SHA256SUMS
            "${winget_manifests[@]}"
          )
          title="Bast $GITHUB_REF_NAME"
          notes_file="$(mktemp)"
          bash .github/scripts/changelog.sh extract "$GITHUB_REF_NAME" > "$notes_file"
          state="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          publish_flags=(--draft=false --title "$title")
          create_flags=(--draft --verify-tag --notes-file "$notes_file" --title "$title")
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            publish_flags+=(--latest)
          else
            publish_flags+=(--prerelease --latest=false)
            create_flags+=(--prerelease)
          fi

          if [[ "$state" == "true" ]]; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" "${publish_flags[@]}"
          elif [[ "$state" == "false" ]]; then
            echo "Release ${GITHUB_REF_NAME} is already published."
          else
            gh release create "$GITHUB_REF_NAME" "${create_flags[@]}"
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}"
            gh release edit "$GITHUB_REF_NAME" "${publish_flags[@]}"
          fi

  publish-linux-repo:
    name: Publish Linux package repository
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install repository tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y reprepro createrepo-c rpm gnupg unzip
          if ! command -v aws >/dev/null 2>&1; then
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp
            sudo /tmp/aws/install
          fi
      - name: Download Linux packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" --dir dist --pattern "bast_*_linux_*"
      - name: Publish packages.bast.sh
        env:
          LINUX_SIGNING_PRIVATE_KEY: ${{ secrets.LINUX_SIGNING_PRIVATE_KEY }}
          LINUX_SIGNING_PUBLIC_KEY: ${{ secrets.LINUX_SIGNING_PUBLIC_KEY }}
          LINUX_SIGNING_PASSPHRASE: ${{ secrets.LINUX_SIGNING_PASSPHRASE }}
          LINUX_APK_RSA_PRIVATE: ${{ secrets.LINUX_APK_RSA_PRIVATE }}
          LINUX_APK_RSA_PUBLIC: ${{ secrets.LINUX_APK_RSA_PUBLIC }}
          PACKAGES_R2_ACCOUNT_ID: ${{ secrets.PACKAGES_R2_ACCOUNT_ID }}
          PACKAGES_R2_ACCESS_KEY_ID: ${{ secrets.PACKAGES_R2_ACCESS_KEY_ID }}
          PACKAGES_R2_SECRET_ACCESS_KEY: ${{ secrets.PACKAGES_R2_SECRET_ACCESS_KEY }}
          PACKAGES_R2_BUCKET: ${{ secrets.PACKAGES_R2_BUCKET }}
        run: bash .github/scripts/publish-linux-repo.sh "$GITHUB_REF_NAME" dist

  bump-homebrew:
    name: Bump Homebrew formula
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Update homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: bash .github/scripts/bump-homebrew-tap.sh "$GITHUB_REF_NAME"
