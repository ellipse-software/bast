name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/bast
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/bast/go.mod
          cache: true
          cache-dependency-path: apps/bast/go.sum
      - run: go mod verify
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go test -race ./...
      - run: go vet ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/bast
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/bast/go.mod
          cache: true
          cache-dependency-path: apps/bast/go.sum
      - name: Build archive
        id: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="dev-${GITHUB_SHA:0:7}"
          fi

          bundle="bast_${version#v}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$bundle"

          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=$version" \
            -o "dist/$bundle/bast" \
            .

          cp ../../LICENSE README.md "dist/$bundle/"
          tar -C dist -czf "dist/$bundle.tar.gz" "$bundle"
          (cd dist && shasum -a 256 "$bundle.tar.gz" > "$bundle.tar.gz.sha256")

          echo "artifact=$bundle" >> "$GITHUB_OUTPUT"
      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: |
            apps/bast/dist/*.tar.gz
            apps/bast/dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build windows/${{ matrix.goarch }}
    needs: validate
    runs-on: windows-latest
    environment: artifact-signing
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: apps/bast
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/bast/go.mod
          cache: true
          cache-dependency-path: apps/bast/go.sum
      - name: Run Windows tests
        if: matrix.goarch == 'amd64'
        run: go test ./...
      - name: Build executable
        id: build
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          $ErrorActionPreference = "Stop"
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          $bundle = "bast_$($version.TrimStart('v'))_windows_$env:GOARCH"
          New-Item -ItemType Directory -Force "dist/$bundle" | Out-Null
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o "dist/$bundle/bast.exe" .
          "artifact=$bundle" >> $env:GITHUB_OUTPUT
          "bundle=$bundle" >> $env:GITHUB_OUTPUT
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign executable
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\apps\bast\dist\${{ steps.build.outputs.bundle }}\bast.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify and package executable
        shell: pwsh
        env:
          BUNDLE: ${{ steps.build.outputs.bundle }}
        run: |
          $ErrorActionPreference = "Stop"
          $signature = Get-AuthenticodeSignature "dist/$env:BUNDLE/bast.exe"
          if ($signature.Status -ne "Valid") { throw "Invalid Authenticode signature: $($signature.Status)" }
          Copy-Item ../../LICENSE, README.md "dist/$env:BUNDLE/"
          Compress-Archive -Path "dist/$env:BUNDLE" -DestinationPath "dist/$env:BUNDLE.zip"
          $hash = (Get-FileHash "dist/$env:BUNDLE.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:BUNDLE.zip" | Set-Content -NoNewline -Encoding ascii "dist/$env:BUNDLE.zip.sha256"
      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: |
            apps/bast/dist/*.zip
            apps/bast/dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          pattern: bast_*
          path: dist
          merge-multiple: true
      - name: Create combined checksums
        run: (cd dist && shasum -a 256 *.tar.gz *.zip > SHA256SUMS)
      - name: Render WinGet manifest
        run: bash .github/scripts/render-winget-manifest.sh "$GITHUB_REF_NAME" dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          assets=(dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.zip dist/*.zip.sha256 dist/SHA256SUMS dist/EllipseSoftware.Bast.yaml)
          title="Bast $GITHUB_REF_NAME"
          state="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null || true)"

          if [[ "$state" == "true" ]]; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest --title "$title"
          elif [[ "$state" == "false" ]]; then
            echo "Release ${GITHUB_REF_NAME} is already published."
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "$title"
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}"
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest --title "$title"
          fi

  bump-homebrew:
    name: Bump Homebrew formula
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Update homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: bash .github/scripts/bump-homebrew-tap.sh "$GITHUB_REF_NAME"
