name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bast:
    name: Go (${{ matrix.os }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/bast
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/bast/go.mod
          cache: true
          cache-dependency-path: apps/bast/go.sum
      - run: go mod verify
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath -o /tmp/bast .

  bast-windows:
    name: Go (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/bast
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/bast/go.mod
          cache: true
          cache-dependency-path: apps/bast/go.sum
      - run: go mod verify
      - name: Validate PowerShell installer
        shell: pwsh
        run: |
          $scriptPath = Resolve-Path "../web/public/install.ps1"
          $tokens = $null
          $parseErrors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            $scriptPath,
            [ref]$tokens,
            [ref]$parseErrors
          )
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw "PowerShell installer contains syntax errors"
          }
          $exitStatements = $ast.FindAll({
            param($node)
            $node -is [System.Management.Automation.Language.ExitStatementAst]
          }, $true)
          if ($exitStatements.Count -gt 0) {
            throw "PowerShell installer must not terminate the caller"
          }
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath -o "$env:RUNNER_TEMP/bast.exe" .
      - name: Cross-build Windows ARM64
        run: go build -trimpath -o "$env:RUNNER_TEMP/bast-arm64.exe" .
        env:
          GOARCH: arm64
          CGO_ENABLED: 0

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test apps/web
      - run: bun run lint:web
      - run: bun run build:web
