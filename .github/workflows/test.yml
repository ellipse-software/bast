name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go (${{ matrix.os }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - run: go mod verify
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath -o /tmp/bast .
