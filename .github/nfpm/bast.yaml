# yaml-language-server: $schema=https://nfpm.goreleaser.com/schema.json
name: bast
arch: ${GOARCH}
platform: linux
version: ${VERSION}
release: "1"
section: utils
priority: optional
maintainer: ellipse Software <legal@ellipse.software>
description: Browse SSH hosts, manage keys, and connect from the terminal
vendor: ellipse Software
homepage: https://bast.sh
license: MIT
disable_globbing: true
contents:
  - src: ${BAST_BIN}
    dst: /usr/bin/bast
    expand: true
    file_info:
      mode: 0755
  - src: ${BAST_README}
    dst: /usr/share/doc/bast/README.md
    expand: true
    file_info:
      mode: 0644
  - src: ${BAST_LICENSE}
    dst: /usr/share/doc/bast/copyright
    expand: true
    file_info:
      mode: 0644
    packager: deb
  - src: ${BAST_LICENSE}
    dst: /usr/share/licenses/bast/LICENSE
    expand: true
    file_info:
      mode: 0644
    packager: rpm
  - src: ${BAST_LICENSE}
    dst: /usr/share/licenses/bast/LICENSE
    expand: true
    file_info:
      mode: 0644
    packager: apk
  - src: ${BAST_LICENSE}
    dst: /usr/share/licenses/bast/LICENSE
    expand: true
    file_info:
      mode: 0644
    packager: archlinux
overrides:
  deb:
    depends:
      - openssh-client
  rpm:
    depends:
      - openssh-clients
  apk:
    depends:
      - openssh-client
  archlinux:
    depends:
      - openssh
deb:
  compression: xz
  fields:
    Bugs: https://github.com/ellipse-software/bast/issues
    Vcs-Browser: https://github.com/ellipse-software/bast
    Vcs-Git: https://github.com/ellipse-software/bast.git
rpm:
  summary: Browse SSH hosts, manage keys, and connect from the terminal
  compression: gzip
  packager: ellipse Software <legal@ellipse.software>
archlinux:
  packager: ellipse Software <legal@ellipse.software>
